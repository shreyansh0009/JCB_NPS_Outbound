# ── HAProxy Configuration — Voice Agent ──────────────────────────────────────
#
# Two frontends:
#   audiosocket_frontend (port 9093) — TCP load balancer for Asterisk AudioSocket
#   http_frontend        (port 8080) — HTTP load balancer for FastAPI admin
#
# Sticky sessions on AudioSocket:
#   Asterisk opens a persistent TCP connection per call. All audio for a call
#   MUST go to the same worker (session state lives on that worker + Redis).
#   We use source-IP stickiness — Asterisk always connects from the same IP.
#
# Session store note:
#   Redis provides the session data. Source stickiness is a performance
#   optimisation (avoids Redis lookup on every packet). If the sticky worker
#   dies, HAProxy reroutes to another worker which loads state from Redis.
#
# Stats dashboard: http://localhost:8404/stats  (admin:admin)

global
    log         stdout format raw local0
    maxconn     50000
    nbthread    4
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 3s
    timeout client  600s    # Max call duration (10 min)
    timeout server  600s


# ── AudioSocket: Asterisk → Voice Agent workers ───────────────────────────────
frontend audiosocket_frontend
    bind *:9093
    default_backend audiosocket_backend

backend audiosocket_backend
    balance source           # Source IP stickiness — one Asterisk = one worker
    hash-type consistent     # Consistent hashing survives worker restarts
    timeout connect 3s
    timeout server  600s

    option tcp-check

    # voice-agent replicas registered by Docker Compose
    # HAProxy resolves via Docker's internal DNS
    server-template voice-agent 1-10 voice-agent:9093 check inter 10s rise 2 fall 3 resolvers docker init-addr libc,none

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s


# ── HTTP Admin: FastAPI health + circuit breaker endpoints ────────────────────
frontend http_frontend
    bind *:8080
    mode http
    option httplog
    default_backend http_backend

backend http_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    server-template voice-agent 1-10 voice-agent:8080 check inter 10s rise 2 fall 3 resolvers docker init-addr libc,none


# ── Stats dashboard ───────────────────────────────────────────────────────────
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats realm "HAProxy Stats"
    stats auth admin:admin
    stats refresh 10s
    stats show-legends
    stats show-node
